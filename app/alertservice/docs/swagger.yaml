basePath: /
definitions:
  entity.Alert:
    properties:
      alert_id:
        type: integer
      alert_name:
        type: string
      description:
        type: string
      endsAt:
        type: string
      generator_url:
        type: string
      severity:
        type: string
      startsAt:
        type: string
      status:
        type: string
      timestamp:
        type: string
    type: object
  entity.Incident:
    properties:
      alert_id:
        type: integer
      description:
        type: string
      generator_url:
        type: string
      incident_id:
        type: integer
      severity:
        type: string
      status:
        type: string
      timestamp:
        type: string
    type: object
  entity.IntervalSetting:
    type: object
  entity.VMAlert:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      dashboardURL:
        type: string
      endsAt:
        type: string
      fingerprint:
        type: string
      generatorURL:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      panelURL:
        type: string
      silenceURL:
