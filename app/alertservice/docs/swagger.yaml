host: 127.0.0.1:8080
info:
  contact: {}
  description: AlertService
  termsOfService: http://swagger.io/terms/
  title: AlertService
  version: "1.0"
paths:
  /api/v1/alerts:
    get:
      description: Retrieve a list of alerts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Alert'
            type: array
      summary: Get all alerts
      tags:
      - alerts
    post:
      consumes:
      - application/json
      description: ппринимает алерты от VM и сохраняет их в базу с дальнейшем уведомлением
      parameters:
      - description: уведомление об алертах
        in: body
        name: notification
        required: true
        schema:
          $ref: '#/definitions/entity.VMAlertNotification'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: int
      summary: принимает алерты от VM
      tags:
      - alerts
  /api/v1/alerts/{alert_id}:
    get:
      description: Retrieve an alert by its ID
      parameters:
      - description: Alert ID
        in: path
        name: alert_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Alert'
      summary: Get alert by ID
      tags:
      - alerts
  /api/v1/incidents:
    get:
      description: Retrieve a list of incidents
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Incident'
            type: array
      summary: Get all incidents
      tags:
      - incidents
  /api/v1/incidents/{incidents_id}:
    get:
      description: Retrieve an incident by its ID
      parameters:
      - description: Incident ID
        in: path
        name: incidents_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Incident'
      summary: Get incident by ID
      tags:
      - incidents
    patch:
      description: Update an existing incident
      parameters:
      - description: Incident ID
        in: path
        name: incidents_id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Update an incident
      tags:
      - incidents
  /api/v1/settings/interval:
    get:
      description: Retrieve the current interval setting
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.IntervalSetting'
      summary: Get interval setting
      tags:
      - settings
    post:
      consumes:
      - application/json
      description: Set a new interval setting
      parameters:
      - description: Interval Setting
        in: body
        name: interval
        required: true
        schema:
          $ref: '#/definitions/entity.IntervalSetting'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Set interval setting
      tags:
      - settings
swagger: "2.0"
