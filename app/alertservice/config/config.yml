app:
  name: 'alertservice'
  version: '1.0.0'

http:
  port: '8787'

logger:
  log_level: 'debug'
  rollbar_env: 'alertservice'

postgres:
  pool_max: 2
  pg_url: "postgres://admin:admin@localhost:5432/vmalertservice?sslmode=disable"

alert_statuses:
  statuses:
    - "Создано"
    - "В работе"
    - "Решено"
    - "Отклонено"